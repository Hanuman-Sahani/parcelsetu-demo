<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ParcelSetu — Clickable Demo (In-City + Railway Parcel Delivery)</title>
<style>
:root{
  color-scheme: light;
  --bg:#f4f4f1; --surface:#ffffff; --chart:#fcfcfb; --line:#e6e5e0; --line2:#efeeea;
  --text:#0b0b0b; --text2:#52514e; --muted:#8a8984;
  --primary:#2a78d6; --primary-d:#1c5cab; --primary-t:#eaf2fc;
  --s1:#2a78d6; --s2:#eb6834;
  --good:#0ca30c; --good-t:#e7f6e7; --good-x:#076b07;
  --warn:#fab219; --warn-t:#fff5df; --warn-x:#8a5a00;
  --bad:#d03b3b; --bad-t:#fbeaea; --bad-x:#a32828;
  --info-t:#eaf2fc; --info-x:#1c5cab;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary)}
h1,h2,h3,h4{margin:0;font-weight:600}
.small{font-size:12px}.muted{color:var(--muted)}.sec{color:var(--text2)}
.row{display:flex;gap:12px;align-items:center}
.wrap{flex-wrap:wrap}
.sp{flex:1}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
@media(max-width:1100px){.g6{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(2,1fr)}.g21,.g2,.g3{grid-template-columns:1fr}}

/* buttons, inputs */
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#cfcec8}
.btn.pri{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.pri:hover{background:var(--primary-d)}
.btn.ok{background:var(--good);border-color:var(--good);color:#fff}
.btn.danger{color:var(--bad-x);border-color:#efc9c9}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.block{width:100%;padding:11px;font-weight:600}
.inp,select.inp,textarea.inp{border:1px solid var(--line);background:#fff;padding:8px 10px;border-radius:8px;width:100%}
.inp:focus{outline:2px solid var(--primary-t);border-color:var(--primary)}
label.f{display:block;font-size:12px;color:var(--text2);margin-bottom:4px;font-weight:500}
.field{margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:7px 14px;cursor:pointer}
.seg button.on{background:var(--primary);color:#fff}
.toggle{width:40px;height:22px;border-radius:11px;background:#cfcec8;position:relative;cursor:pointer;border:0;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.toggle.on{background:var(--good)}.toggle.on::after{left:21px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card h3{font-size:15px;margin-bottom:2px}
.card .sub{font-size:12px;color:var(--muted);margin-bottom:12px}
.ch{display:flex;align-items:flex-start;gap:8px;margin-bottom:12px}
.ch .sub{margin:0}
.kpi .lbl{font-size:12px;color:var(--text2)}
.kpi .val{font-size:24px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .dl{font-size:12px;margin-top:2px;color:var(--muted)}
.dl.up{color:var(--good-x)}.dl.down{color:var(--bad-x)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 8px;border-radius:999px;font-weight:500;white-space:nowrap;background:#f0efec;color:var(--text2)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.chip.ok{background:var(--good-t);color:var(--good-x)}
.chip.warn{background:var(--warn-t);color:var(--warn-x)}
.chip.bad{background:var(--bad-t);color:var(--bad-x)}
.chip.info{background:var(--info-t);color:var(--info-x)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:5px;border:1px solid var(--line);color:var(--text2);background:#fafaf8;white-space:nowrap}
.tag.rail{border-color:#f5cdb9;background:#fdf1eb;color:#a8441b}
.tag.city{border-color:#c4dbf6;background:#eef5fd;color:#1c5cab}

/* tables */
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:#fff}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:600;font-size:12px;color:var(--text2);background:#fafaf8;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
td{padding:9px 12px;border-bottom:1px solid var(--line2);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fafaf8}
tr.click{cursor:pointer}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tfoot td{font-weight:600;background:#fafaf8;border-top:1px solid var(--line)}
.id{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}

/* login */
.login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:32px;background:linear-gradient(160deg,#eef4fc 0%,#f4f4f1 55%,#fbf1ea 100%)}
.login-box{max-width:1040px;width:100%}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px}
.logo .mk{width:34px;height:34px;border-radius:9px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px}
.rolecard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:6px}
.rolecard:hover{border-color:var(--primary);box-shadow:0 6px 20px rgba(42,120,214,.12);transform:translateY(-2px)}
.rolecard .rt{font-weight:600;font-size:16px}
.rolecard ul{margin:6px 0 0;padding-left:18px;color:var(--text2);font-size:12.5px}
.rolecard .badge{align-self:flex-start;font-size:11px;padding:2px 8px;border-radius:6px;background:var(--primary-t);color:var(--primary-d);font-weight:600}

/* shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:#14161a;color:#d9dadc;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side .brand{padding:18px 18px 10px}
.side .brand .logo{color:#fff;font-size:17px}
.side .who{margin:4px 12px 10px;padding:10px;border-radius:8px;background:#1f2228;font-size:12px}
.side .who b{display:block;color:#fff;font-size:13px}
.side nav{flex:1;overflow:auto;padding:4px 8px}
.side nav a{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;color:#c3c5c9;text-decoration:none;cursor:pointer;font-size:13.5px}
.side nav a:hover{background:#1f2228;color:#fff}
.side nav a.on{background:var(--primary);color:#fff}
.side nav .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#6f7379;padding:12px 10px 4px}
.side .foot{padding:12px}
.side .foot .btn{width:100%;background:#1f2228;border-color:#2b2f36;color:#d9dadc}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:14px 24px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top h1{font-size:18px}
.top .crumb{font-size:12px;color:var(--muted)}
.content{padding:20px 24px 48px}
.demo-bar{background:#fff8e6;border-bottom:1px solid #f3e2b5;color:#7a5600;font-size:12px;padding:6px 24px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#bbb}
.dot.on{background:var(--good)}.dot.busy{background:var(--warn)}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{border:0;background:none;padding:9px 14px;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.tabs button.on{color:var(--primary-d);border-color:var(--primary)}

/* timeline */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .ev{position:relative;padding-bottom:16px}
.tl .ev::before{content:"";position:absolute;left:-21px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 3px #fff}
.tl .ev.done::before{background:var(--good)}
.tl .ev.todo::before{background:#d6d5d0}
.tl .ev.todo{color:var(--muted)}
.tl .ev .t{font-weight:600}
.tl .ev .m{font-size:12px;color:var(--muted)}
.medias{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.media{width:118px;border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;background:#fff;font-size:11px}
.media svg,.media img{display:block;width:100%;height:72px;object-fit:cover}
.media span{display:block;padding:4px 6px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* legs */
.legs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.leg{border:1px solid var(--line);border-radius:8px;padding:10px;background:#fcfcfb}
.leg .ln{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.leg.cur{border-color:var(--primary);background:var(--primary-t)}

/* modal */
.ov{position:fixed;inset:0;background:rgba(15,17,20,.45);display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;z-index:50;overflow:auto}
.modal{background:#fff;border-radius:14px;width:100%;max-width:980px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.sm{max-width:520px}
.modal .mh{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal .mb{padding:20px}
.x{border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
.kv{display:grid;grid-template-columns:120px 1fr;gap:4px 10px;font-size:13px}
.kv div:nth-child(odd){color:var(--muted)}

/* toast + tip */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#14161a;color:#fff;padding:10px 16px;border-radius:9px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:99;max-width:90vw}
#toast.show{opacity:1}
.banner{padding:12px 14px;border-radius:10px;margin-bottom:14px;font-size:13px}
.banner.warn{background:var(--warn-t);color:#5c3d00;border:1px solid #f3dca0}
.banner.bad{background:var(--bad-t);color:var(--bad-x);border:1px solid #efc9c9}
.nb{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:600;line-height:18px;text-align:center;margin-left:6px}
.mback{display:none;border:0;background:none;font-size:22px;cursor:pointer;padding:0 6px 0 0;line-height:1}
.bnav{display:none}
.addrbox{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px;background:#fff}
.addrbox h4 .dotk{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.mapbox{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px;background:#eef2ea}
.mapbox svg{display:block;width:100%;height:110px}
.mapbox .mb2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px;background:#fff;border-top:1px solid var(--line)}
details.api{margin-top:12px;border:1px solid var(--line);border-radius:10px;background:#fafaf8}
details.api summary{cursor:pointer;padding:10px 12px;font-weight:600;font-size:13px}
details.api pre{margin:0;padding:0 12px 12px;font-size:11.5px;overflow:auto;max-height:320px;white-space:pre}
.cb[disabled]{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.cb{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;cursor:pointer;font-size:13px;text-align:left;line-height:1.3}
.cb small{display:block;color:var(--muted);font-size:11px}
.cb.on{border-color:var(--primary);background:var(--primary-t);color:var(--primary-d);font-weight:600}
.cb.on small{color:var(--primary-d)}
.step3{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.step3 button{border:0;background:#fafaf8;width:36px;height:36px;font-size:18px;cursor:pointer}
.step3 span{min-width:40px;text-align:center;font-weight:600}
.sumbox{background:#fafaf8;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;margin-top:12px}
.sumbox .r{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.sumbox .r span:first-child{color:var(--muted)}
#tip{position:fixed;pointer-events:none;background:#fff;border:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.12);border-radius:8px;padding:8px 10px;font-size:12px;z-index:98;display:none;min-width:130px}
#tip .tt{font-weight:600;margin-bottom:4px}
#tip .tr{display:flex;align-items:center;gap:6px;justify-content:space-between}
#tip .sw{width:10px;height:3px;border-radius:2px;display:inline-block}

/* chart */
.chart{width:100%;position:relative}
.chart svg{display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--text2);margin-bottom:6px}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.legend i.sq{width:10px;height:10px;border-radius:3px}

/* phone */
.phone-stage{display:grid;grid-template-columns:auto minmax(0,1fr);gap:32px;align-items:start}
@media(max-width:1000px){.phone-stage{grid-template-columns:1fr}}
.phone{width:380px;height:780px;border:11px solid #16181c;border-radius:44px;background:#f4f4f1;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.18);position:relative}
.phone .notch{height:26px;background:#16181c;width:150px;border-radius:0 0 16px 16px;margin:0 auto;flex:none}
.ph-head{background:var(--primary);color:#fff;padding:12px 16px}
.ph-head .t{font-weight:600;font-size:16px}
.ph-head .s{font-size:12px;opacity:.85}
.ph-body{flex:1;overflow:auto;padding:12px}
.ph-nav{display:flex;border-top:1px solid var(--line);background:#fff;flex:none}
.ph-nav button{flex:1;border:0;background:none;padding:9px 2px 12px;font-size:11px;color:var(--muted);cursor:pointer}
.ph-nav button b{display:block;font-size:17px;line-height:1.2;font-weight:400}
.ph-nav button.on{color:var(--primary-d);font-weight:600}
.pcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.pcard .h{font-weight:600}
.step{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line)}
.step:last-child{border:0}
.step .n{width:24px;height:24px;border-radius:50%;background:#e9e8e4;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex:none}
.step.done .n{background:var(--good);color:#fff}
.step.cur .n{background:var(--primary);color:#fff}
.upl{border:1.5px dashed #c9c8c2;border-radius:10px;padding:14px;text-align:center;color:var(--text2);cursor:pointer;background:#fff;display:block}
.upl input{display:none}
.notes{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px}
.notes h3{margin-bottom:8px}
.notes ul{margin:6px 0 14px;padding-left:18px;color:var(--text2)}
.pricebox{background:#fafaf8;border:1px solid var(--line);border-radius:10px;padding:12px}
.pricebox .r{display:flex;justify-content:space-between;padding:3px 0;font-size:13px}
.pricebox .r.t{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-weight:700;font-size:15px}
.rep-list a{display:block;padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--text);text-decoration:none}
.rep-list a:hover{background:#f4f4f1}
.rep-list a.on{background:var(--primary-t);color:var(--primary-d);font-weight:600}
.alert{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2);font-size:13px}
.alert:last-child{border:0}
.alert>.chip{flex:none;align-self:flex-start}
.drop{border:2px dashed #c9c8c2;border-radius:12px;padding:28px;text-align:center;color:var(--text2)}
.track-hero{max-width:720px;margin:40px auto;padding:0 16px}

/* ---------- responsive: tablets & phones ---------- */
.hamb{display:none;border:1px solid var(--line);background:#fff;border-radius:8px;width:38px;height:38px;font-size:18px;cursor:pointer;flex:none}
.nav-bd{display:none}
.rep-grid{grid-template-columns:240px minmax(0,1fr)}
.tbl-wrap{-webkit-overflow-scrolling:touch}
@media(max-width:1100px){.g3.keep3{grid-template-columns:repeat(3,1fr)}}
@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:60;transform:translateX(-100%);transition:transform .2s}
  body.nav-open .side{transform:none;box-shadow:0 0 40px rgba(0,0,0,.35)}
  body.nav-open .nav-bd{display:block;position:fixed;inset:0;background:rgba(15,17,20,.45);z-index:55}
  .bnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:40;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 16px rgba(0,0,0,.05)}
  .bnav button{flex:1;border:0;background:none;padding:8px 2px 10px;font-size:11px;color:var(--muted);cursor:pointer;position:relative}
  .bnav button b{display:block;font-size:18px;line-height:1.25;font-weight:400}
  .bnav button.on{color:var(--primary-d);font-weight:600}
  .bnav .nb{position:absolute;top:3px;left:calc(50% + 6px);margin:0}
  .content{padding-bottom:96px!important}
  #toast{bottom:84px}
  .mback{display:inline-block}
  .modal .x{display:none}
  /* tables become cards */
  .rt{max-height:none!important;overflow:visible;background:transparent;border:0}
  .rt thead{display:none}
  .rt table,.rt tbody,.rt tfoot,.rt tr,.rt td{display:block;width:100%}
  .rt tbody tr,.rt tfoot tr{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:8px}
  .rt tfoot tr{background:#fafaf8}
  .rt td{border:0!important;padding:4px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;white-space:normal;text-align:right;background:transparent!important}
  .rt td::before{content:attr(data-l);color:var(--muted);font-size:12px;text-align:left;flex:none;font-weight:400}
  .rt td:first-child{font-weight:600}
  .rt td[colspan]{display:block;text-align:center}
  .rt td[colspan]::before{content:none}
  .top{padding:10px 14px;gap:8px;flex-wrap:wrap}
  .top h1{font-size:16px}
  .top .hide-m,.hide-m{display:none!important}
  .top .btn{padding:6px 10px}
  .demo-bar{padding:5px 14px;font-size:11px}
  .content{padding:14px 12px 40px}
  .grid{gap:12px}
  .g6,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3,.g2,.g21,.rep-grid{grid-template-columns:minmax(0,1fr)}
  .g3.keep3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .card{padding:14px}
  .kpi .val{font-size:20px}
  .tabs{overflow-x:auto;white-space:nowrap;scrollbar-width:none}
  .tabs button{padding:9px 10px;flex:none}
  .filters{flex-wrap:wrap}
  .filters .inp,.filters select.inp{width:100%!important;flex:1 1 100%}
  .filters .sp{display:none}
  .ch{flex-wrap:wrap}
  .rep-list{display:flex;overflow-x:auto;gap:4px;padding:6px!important}
  .rep-list a{white-space:nowrap;flex:none}
  td,th{padding:8px 10px}
  .ov{padding:0}
  .modal{border-radius:0;min-height:100%;max-width:none}
  .modal.sm{border-radius:14px;min-height:auto;margin:16px}
  .modal .mh{flex-wrap:wrap;padding:12px 14px;position:sticky;top:0;background:#fff;z-index:2}
  .modal .mb{padding:14px}
  .legs{grid-template-columns:1fr!important}
  .kv{grid-template-columns:105px 1fr}
  .login{padding:18px 14px;align-items:flex-start}
  .login h2{font-size:20px!important}
  .rolecard ul{display:none}
  .rolecard{padding:14px}
  .rolecard .btn{white-space:normal;padding:9px 8px;font-size:13px}
  .g2.keep2{grid-template-columns:repeat(2,minmax(0,1fr))}

<script>
/* =========================================================================

const BRAND = 'ParcelSetu';
const NOW = new Date();

/* ---------- helpers ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let _rng = mulberry32(20261101);
const R = () => _rng();
const seedOf = str => { let h=7; for(const c of str) h=(h*31+c.charCodeAt(0))|0; return h; };
const pick = a => a[Math.floor(R()*a.length)];
const rint = (a,b) => a+Math.floor(R()*(b-a+1));
const r10 = n => Math.round(n/10)*10;

const addMin = (d,m) => new Date(d.getTime() + m*60000);

/* ---------- master data ---------- */
const CITIES = {
  Jaipur:{st:'Jaipur Jn (JP)',state:'Rajasthan',ll:[26.9124,75.7873],areas:['Johari Bazaar','Malviya Nagar','Vaishali Nagar','Mansarovar','C-Scheme','Raja Park'],pins:['302003','302017','302021','302020','302001','302004']},

  Lucknow:{st:'Lucknow Charbagh (LKO)',state:'Uttar Pradesh',ll:[26.8467,80.9462],areas:['Hazratganj','Aminabad','Gomti Nagar','Alambagh'],pins:['226001','226018','226010','226005']},
  Kota:{st:'Kota Jn (KOTA)',state:'Rajasthan',ll:[25.2138,75.8648],areas:['Talwandi','Vigyan Nagar','Gumanpura','Mahaveer Nagar'],pins:['324005','324009','324007','324011']}
};
const CITY_NAMES = Object.keys(CITIES);
const PIN = {}; for(const c in CITIES) CITIES[c].pins.forEach((p,i)=>{ PIN[p]={city:c,area:CITIES[c].areas[i],state:CITIES[c].state}; });
function mkAddr(city, o={}){ const c=CITIES[city], ai=rint(0,c.areas.length-1);
  return {name:o.name||'', phone:o.phone||'', line1:o.line1||pick(['Shop','House','Flat','Plot'])+' No. '+rint(4,220)+(R()<.4?', '+pick(['1st','2nd','Ground'])+' floor':''),
    line2:o.line2||pick(['Main Bazaar Road','Gali No. '+rint(1,9),'Sector '+rint(1,20)+' Market','Station Road','Link Road']),
    landmark:o.landmark||pick(['Near Hanuman Mandir','Opp. SBI Bank','Behind Petrol Pump','Near Metro Station','Next to Post Office','Near Govt. School']),
    area:c.areas[ai], city, state:c.state, pincode:c.pins[ai], lat:+(c.ll[0]+(R()-.5)*.07).toFixed(5), lng:+(c.ll[1]+(R()-.5)*.07).toFixed(5)}; }
const fmtAddr = a => `${a.line1}, ${a.line2}, ${a.area}, ${a.city} ${a.pincode}`;
const addr = c => fmtAddr(mkAddr(c));
function distKm(a,b){ const r=x=>x*Math.PI/180, dLa=r(b.lat-a.lat), dLo=r(b.lng-a.lng); const h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2; return Math.max(1.5, Math.round(2*6371*Math.asin(Math.sqrt(h))*1.3*10)/10); }
const GODOWN = {line1:'Plot 14, Godown No. 3',line2:'Sitapura Industrial Area',landmark:'Near RIICO office',area:'Sitapura',city:'Jaipur',state:'Rajasthan',pincode:'302022',lat:26.7807,lng:75.8236};

const SHOPS = [
  ['Sharma Textiles','Rakesh Sharma','Jaipur'],['Gupta Electronics','Amit Gupta','Jaipur'],['Agarwal Sweets','Neha Agarwal','Jaipur'],
  ['Mehta Pharma','Kiran Mehta','Ahmedabad'],['Khan Footwear','Arif Khan','Delhi'],['Patel Handicrafts','Jignesh Patel','Ahmedabad'],
  ['Jain Book Depot','Sunil Jain','Kota'],['Singh Auto Parts','Harpreet Singh','Delhi'],['Verma Garments','Pooja Verma','Lucknow'],
  ['Kapoor Mobiles','Rahul Kapoor','Mumbai'],['Rathore Spices','Devendra Rathore','Jaipur'],['Bansal Hardware','Manoj Bansal','Kota'],

].map((s,i)=>({id:'SK'+(101+i),name:s[0],owner:s[1],city:s[2],phone:phone(),addr:addr(s[2]),

SHOPS.forEach(sh=>{ sh.loc=mkAddr(sh.city,{name:sh.owner,phone:sh.phone,line1:'Shop No. '+rint(3,90)+', '+sh.name}); sh.addr=fmtAddr(sh.loc); });
const shopById = id => SHOPS.find(s=>s.id===id);

const BOYS = [

].map((b,i)=>({id:'DB'+(11+i),name:b[0],city:b[1],vehicle:b[2]+' · RJ'+rint(10,99)+'-'+['SA','CB','KM','TX'][i%4]+'-'+rint(1000,9999),phone:phone(),
  online: i!==2 && i!==7, busy: i===1||i===4, rating:(4.3+R()*0.6).toFixed(1), joined:new Date(NOW.getTime()-rint(40,300)*864e5)}));
const boyIn = c => BOYS.filter(b=>b.city===c);

const AGENTS = [
  ['Mahesh Parcel Agency','Mahesh Choudhary','Jaipur'],['Northern Rail Parcels','Vinod Arora','Delhi'],['Western Parcel Co.','Sanjay Desai','Mumbai'],
  ['Gujarat Rail Cargo','Hitesh Shah','Ahmedabad'],['Awadh Parcel Services','Anwar Hussain','Lucknow'],['Hadoti Parcel Point','Gopal Nagar','Kota']
].map((a,i)=>({id:'RA'+(21+i),agency:a[0],name:a[1],city:a[2],station:CITIES[a[2]].st,phone:phone(),fee:[50,60,70,50,50,40][i]}));
AGENTS.forEach(a=>{ const c=CITIES[a.city]; a.loc={name:a.name+' ('+a.agency+')',phone:a.phone,line1:'Parcel Office, Platform 1',line2:a.station,landmark:'Next to main entrance',area:'Station Road',city:a.city,state:c.state,pincode:c.pins[0],lat:+(c.ll[0]+.004).toFixed(5),lng:+(c.ll[1]-.003).toFixed(5)}; a.loc.addr=a.agency+', Parcel Office, '+a.station; });
const agentIn = c => AGENTS.find(a=>a.city===c);

const DRIVERS = ['Sunil','Kamal','Raju','Naresh','Ajay','Vijay','Pankaj','Lokesh','Sanjay','Bablu'];
const RECEIVERS = ['Anita Joshi','Prakash Rao','Fatima Sheikh','Gaurav Mishra','Kavita Nair','Rohan Desai','Sneha Kulkarni','Tarun Bhatia','Pallavi Singh','Yusuf Qureshi','Nikhil Jain','Divya Menon','Ashok Tiwari','Shalini Gupta'];
const ITEMS = ['Garments (12 pcs)','Mobile accessories','Sweets box','Medicines (sealed)','Footwear (6 pairs)','Handicraft items','Books (20 pcs)','Auto spare parts','Sarees (8 pcs)','Electronics','Spices (sealed packs)','Hardware tools','Gift hampers','Crockery'];

const CATS=[['Documents','📄'],['Clothing & textiles','👕'],['Electronics & mobiles','📱'],['Food & sweets','🍬'],['Medicines','💊'],['Household & crockery','🏠'],['Auto & hardware parts','🔧'],['Books & stationery','📚'],['Other','📦']];
function catFor(it){ return /Garment|Saree|Footwear/.test(it)?'Clothing & textiles':/Mobile|Electronic/.test(it)?'Electronics & mobiles':/Sweet|Spice/.test(it)?'Food & sweets':/Medicine/.test(it)?'Medicines':/Crockery|Gift|Handicraft|almirah/i.test(it)?'Household & crockery':/Auto|Hardware/.test(it)?'Auto & hardware parts':/Book/.test(it)?'Books & stationery':'Other'; }
function vehicleFor(chW, maxSide){ return chW<=20 && maxSide<=60 ? '2 Wheeler' : chW<=500 ? '3 Wheeler' : 'Tata Ace / pickup'; }
const IN_FLOW = ['Request Raised','Approved & Assigned','Picked Up','Out for Delivery','Delivered'];
const RL_FLOW = ['Request Raised','Approved & Assigned','Picked Up from Shop','Handed to Origin Agent','Received by Origin Agent','Loaded on Train','In Transit by Train','Arrived at Destination','Received by Destination Agent','Leg 3 Assigned','Out for Delivery','Delivered'];
const MEDIA_AT = {
  'Picked Up':[['Pickup photo','img']], 'Picked Up from Shop':[['Pickup photo','img']],
  'Handed to Origin Agent':[['Handover photo','img']],
  'Received by Origin Agent':[['Parcel received','img']],
  'Loaded on Train':[['Loading video','video'],['PWB receipt','img']],
  'Received by Destination Agent':[['Unloading photo','img']],
  'Delivered':[['Delivery photo','img'],['OTP verified','img']]
};

/* ---------- shipment builder ---------- */
let SEQ = 24101;
const SH = [];
function roadLeg(n, city, fromLoc, toLoc, mode, boy, weight){
  const km = distKm(fromLoc, toLoc), far = km>60;
  const isP = mode==='Porter';
  const veh = far||weight>25 ? 'Tata Ace' : weight>10 ? '3 Wheeler' : '2 Wheeler';
  return {n, kind:'road', city, from:fromLoc.addr||fmtAddr(fromLoc), to:toLoc.addr||fmtAddr(toLoc), fromLoc, toLoc, mode, km,
    boy: isP?null:boy, porter: isP?{crn:'CRN'+rint(10000000,99999999), driver:pick(DRIVERS), vehicle:veh, phone:phone()}:null,
    cost: far ? (isP ? r10(km*21) : r10(km*9)) : isP ? r10(70 + km*13 + (weight>10?60:0)) : r10(35 + km*5)};
}
function makeLegs(s, o={}){
  const fc=s.from.city, tc=s.to.city, w=s.weight; s.legs=[];
  const pickMode=(city,forced)=>{ if(forced) return forced; const bs=boyIn(city).filter(b=>b.online); return (bs.length&&R()<0.45)?'Own':'Porter'; };
  const anyBoy=c=>pick(boyIn(c).length?boyIn(c):BOYS);
  if(s.type==='incity'){
    const m=pickMode(fc,o.mode1), lg=roadLeg(1, fc===tc?fc:fc+' → '+tc, s.from, s.to, m, o.boy1||anyBoy(fc), w);
    s.legs.push(lg); s.cost=lg.cost; s.price = fc!==tc ? r10(lg.cost*1.22) : m==='Porter' ? r10(lg.cost*1.24) : r10(60+lg.km*9+w*4);
  } else {
    const ao=agentIn(fc), ad=agentIn(tc), m1=pickMode(fc,o.mode1), m3=pickMode(tc,o.mode3);
    s.legs.push(roadLeg(1, fc, s.from, ao.loc, m1, o.boy1||anyBoy(fc), w));
    const hours=o.trainHours||rint(6,20), rail=r10(60+w*14), agentFee=ao.fee+ad.fee;
    s.legs.push({n:2, kind:'train', from:ao.station, to:ad.station, agentO:ao, agentD:ad, rail, agentFee, cost:rail+agentFee,
      train:{no:String(rint(12001,12999)), name:`${fc}–${tc} SF Express`, pwb:'PWB'+rint(1000000,9999999), coach:'SLR-'+rint(1,2), hours, charges:rail}});
    s.legs.push(roadLeg(3, tc, ad.loc, s.to, m3, o.boy3||anyBoy(tc), w));
    s.cost=s.legs.reduce((a,l)=>a+l.cost,0); s.price=r10(s.cost*1.22);
  }
  s.flow = s.type==='incity'?IN_FLOW:RL_FLOW;
}
function build(o){
  const shop = o.shop, type = o.type;
  const toCity = o.toCity || (o.to && o.to.city);
  const weight = o.weight ?? (type==='incity'? rint(1,14) : rint(3,35));
  const s = {id:'PS'+(SEQ++), type, shop, created:o.created, weight, items:o.items||ITEMS[SHOPS.indexOf(shop)%ITEMS.length],
    dims:`${rint(20,60)}×${rint(15,40)}×${rint(10,35)} cm`, declared:rint(8,250)*100,
    from: o.from || {...shop.loc, addr:shop.addr},
    to: o.to || (()=>{ const a=mkAddr(toCity,{name:pick(RECEIVERS),phone:phone()}); a.addr=fmtAddr(a); return a; })(),
    pay: pick(['Wallet','UPI','Wallet','Card']), bookedBy: R()<0.75?'Shopkeeper':'Admin', otp: String(rint(1000,9999)), legs:[], events:[], delayed:false};
  { const d=s.dims.match(/\d+/g).map(Number); s.volW=Math.round(d[0]*d[1]*d[2]/500)/10; }
  s.qty=o.qty||rint(1,3); s.cat=o.cat||catFor(s.items); s.fragile=o.fragile??/Crockery|Electronics|Sweets|Handicraft|Mobile/.test(s.items);
  s.pickup=o.pickup||pick(['Today · within 60 min','Today · 12–2 PM','Today · 4–6 PM','Tomorrow · 10 AM–12 PM']);
  s.vehicle=o.vehicle||vehicleFor(Math.max(weight,s.volW), Math.max(...s.dims.match(/\d+/g).map(Number)));
  makeLegs(s, o);
  // step durations (minutes)
  const hrs = type==='railway' ? s.legs[1].train.hours : 0;
  const dur = type==='incity' ? [0,4,rint(15,35),rint(5,12),rint(20,45)]
    : [0,rint(10,30),rint(40,90),rint(30,70),rint(5,20),rint(90,240),rint(5,15),hrs*60,rint(15,40),rint(5,15),rint(30,60),rint(30,60)];
  let t = new Date(s.created), stage = o.stage;
  for(let k=0;k<=stage;k++){
    t = addMin(t, dur[k]);
    if(t>NOW && k>0){ stage = k-1; break; }
    pushEvent(s, s.flow[k], t);
  }
  s.stage = Math.min(stage, s.flow.length-1);
  s.status = s.flow[s.stage];
  if(o.cancel){ s.status='Cancelled'; s.events.push({st:'Cancelled', t:addMin(s.created,12), by:'Admin (on shopkeeper request)', media:[], note:'Refund ₹'+s.price+' to wallet'}); }
  if(type==='railway' && ['Loaded on Train','In Transit by Train'].includes(s.status) && R()<0.35) s.delayed = true;
  if(o.delayed) s.delayed = true;
  SH.push(s);
  return s;
}
function legFor(s, st){
  if(s.type==='incity') return s.legs[0];
  const i = s.flow.indexOf(st);
  return i<=3 ? s.legs[0] : i<=8 ? s.legs[1] : s.legs[2];
}
function actor(s, st){
  const L = legFor(s, st);
  if(st==='Request Raised') return s.bookedBy==='Admin' ? 'Admin · Anil Kumar (order taken on phone)' : s.shop.owner+' (Shopkeeper)';
  if(st==='Approved & Assigned') return 'Admin · Anil Kumar · approved, ' + (L.mode==='Porter' ? 'Porter order '+L.porter.crn : 'assigned to '+L.boy.name);
  if(st==='Leg 3 Assigned') return 'System (auto) · ' + (L.mode==='Porter' ? 'Porter order '+L.porter.crn : 'assigned to '+L.boy.name);
  if(st==='In Transit by Train') return 'System · Train '+s.legs[1].train.no+' departed';
  if(['Received by Origin Agent','Loaded on Train'].includes(st)) return s.legs[1].agentO.name+' (Railway Agent)';
  if(['Arrived at Destination','Received by Destination Agent'].includes(st)) return s.legs[1].agentD.name+' (Railway Agent)';
  return L.mode==='Porter' ? 'Porter API · '+L.porter.driver+' ('+L.porter.vehicle+')' : L.boy.name+' (Delivery Boy)';
}
function pushEvent(s, st, t, extra){
  const media = (MEDIA_AT[st]||[]).map(m=>({label:m[0], kind:m[1], t, gps:`${(26+R()*2).toFixed(4)}, ${(75+R()*3).toFixed(4)}`}));
  s.events.push(Object.assign({st, t, by:actor(s, st), media}, extra||{}));
}

/* random history */
for(let i=0;i<64;i++){

  const last = type==='incity'?4:11;
  const stage = daysAgo===0 ? rint(0, type==='incity'?4:6) : daysAgo===1 ? (type==='incity'?4:rint(5,11)) : last;
  build({shop, type, toCity, created, stage, cancel: daysAgo>1 && R()<0.05});
}

const D4 = build({shop:SHOPS[2], type:'railway', toCity:'Lucknow', created:minsAgo(240), stage:3, mode1:'Porter', mode3:'Porter', items:'Sweets box', weight:7});
const D5 = build({shop:SHOPS[10], type:'railway', toCity:'Mumbai', created:minsAgo(300), stage:4, mode1:'Own', boy1:BOYS[1], mode3:'Own', items:'Spices (sealed packs)', weight:18});
const REQ_NOTES=['Please pick after 4 PM, shop is busy before that','Fragile items, handle with care','Receiver available only till 7 PM','Call before coming, godown is at the back'];
[[SHOPS[0],'incity','Jaipur',9,6,'Garments (20 pcs)'],[SHOPS[9],'railway','Delhi',26,12,'Mobile accessories'],[SHOPS[3],'incity','Ahmedabad',41,3,'Medicines (sealed)'],[SHOPS[0],'railway','Lucknow',58,15,'Garments (40 pcs)'],[SHOPS[7],'railway','Jaipur',80,22,'Auto spare parts']]
  .forEach((r,i)=>{ const x=build({shop:r[0],type:r[1],toCity:r[2],created:minsAgo(r[3]),stage:0,weight:r[4],items:r[5]}); if(i%2===0) x.reqNote=REQ_NOTES[i%4]; });
{ const x=build({shop:SHOPS[0],type:'railway',toCity:'Kota',created:minsAgo(60*30),stage:0,weight:48,items:'Iron almirah (1 pc)'}); x.status='Rejected'; x.rejectReason='Parcel too heavy for railway parcel van (48 kg). Please split into 2 boxes.'; x.events.push({st:'Rejected',t:minsAgo(60*29.7),by:'Admin · Anil Kumar',media:[],note:x.rejectReason}); }

/* ---------- aggregates (sample) ---------- */
const MONTHS = Array.from({length:12},(_,i)=>{const d=new Date(NOW.getFullYear(), NOW.getMonth()-12+i, 1); return d.toLocaleDateString('en-IN',{month:'short'})+" '"+String(d.getFullYear()).slice(2)});
const REV = [140000,188000,231000,279000,312000,391000,438000,522000,594000,681000,763000,889000];

const DAYS = Array.from({length:14},(_,i)=>{const d=new Date(NOW.getTime()-(13-i)*864e5); return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'})});
const D_IN = [41,38,45,52,47,39,55,58,49,61,57,52,63,66];
const D_RL = [19,22,24,21,27,25,29,31,28,33,30,35,37,41];
const LAST = REV.length-1;

/* ---- navigation with real browser history, so the phone's Back button works ---- */
let NAVD=0, MODAL_PUSHED=false;
function baseHash(){ if(S.role==='track') return 'track/'+(S.trackId||''); if(!S.role) return '';
  if(S.role==='boy') return 'boy/'+(S.boyJob?'job/'+S.boyJob:S.boyTab);
  if(S.role==='agent') return 'agent/'+(S.agentSel?'p/'+S.agentSel:S.agentTab);
  return S.role+'/'+S.page; }
function nav(){ const h=baseHash(); if(location.hash.slice(1)!==h) history.pushState({n:++NAVD},'','#'+h); document.body.classList.remove('nav-open'); render(); window.scrollTo(0,0); }
function go(p){ S.page=p; nav(); }
function login(r){ closeModalNow(); S.role=r; S.page = r==='admin'?'dashboard':r==='shop'?'sdash':r; S.boyJob=null; S.agentSel=null; S.boyTab='home'; S.agentTab='home'; nav(); }
function logout(){ closeModalNow(); S.role=null; nav(); }
function goBack(){ if(NAVD>0) history.back(); else { S.boyJob=null; S.agentSel=null; nav(); } }
function boyOpen(id){ S.boyJob=id; S.pending={}; nav(); }
function boyTabGo(t){ S.boyJob=null; S.boyTab=t; nav(); }
function agentOpen(id){ S.agentSel=id; S.pending={}; nav(); }
function agentTabGo(t){ S.agentSel=null; S.agentTab=t; nav(); }
function applyHash(){
  const parts=location.hash.slice(1).split('/'), r=parts[0];
  closeModalNow(); MODAL_PUSHED=false;
  if(!r) S.role=null;
  else if(r==='track'){ S.role='track'; if(parts[1]) S.trackId=parts[1]; }
  else if(r==='boy'){ S.role='boy'; S.boyJob = parts[1]==='job' ? parts[2] : null; if(parts[1]!=='job') S.boyTab = parts[1]||'home'; }
  else if(r==='agent'){ S.role='agent'; S.agentSel = parts[1]==='p' ? parts[2] : null; if(parts[1]!=='p') S.agentTab = parts[1]||'home'; }
  else if(ROLES[r]){ S.role=r; S.page = parts[1] || (r==='admin'?'dashboard':'sdash'); }
  render();
  const d=parts[2];
  if(d && (r==='admin'||r==='shop')){ if(S.page==='reports' && !d.includes(':')){ S.report=d; render(); } else openDetail(d,false); }
}
window.addEventListener('popstate', ()=>{ NAVD=Math.max(0,NAVD-1); applyHash(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });
function openDetail(d, push=true){
  if(push){ history.pushState({n:++NAVD},'','#'+baseHash()+'/'+d); MODAL_PUSHED=true; }

}

/* =========================================================================
   CHARTS (SVG, hover tooltips)
   ========================================================================= */
function niceStep(r){const p=10**Math.floor(Math.log10(r));const f=r/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
function chartDiv(id, cfg){ CH[id]=cfg; const lg = cfg.series && cfg.series.length>1 ? `<div class="legend">${cfg.series.map(s=>`<span><i class="${cfg.kind==='stack'?'sq':''}" style="background:${s.color}"></i>${s.name}</span>`).join('')}</div>` : ''; return `${lg}<div class="chart" id="${id}" style="height:${cfg.h||240}px"></div>`; }
function drawCharts(){ for(const id in CH){ const el=document.getElementById(id); if(!el) continue; const c=CH[id]; el.innerHTML = c.kind==='line'?lineSVG(id,el.clientWidth,c):c.kind==='stack'?stackSVG(id,el.clientWidth,c):hbarSVG(id,el.clientWidth,c); } }
window.addEventListener('resize',()=>{clearTimeout(window._rz);window._rz=setTimeout(drawCharts,120)});
function yAxis(W,m,ih,max,step,fmt){ let g=''; for(let v=0; v<=max+1e-9; v+=step){ const y=m.t+ih-(v/max)*ih; g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y}" y2="${y}" stroke="${v===0?'#cfcec8':'#ecebe7'}" stroke-width="1"/><text x="${m.l-8}" y="${y+4}" text-anchor="end" font-size="11" fill="#8a8984">${fmt(v)}</text>`; } return g; }
function lineSVG(id,W,c){
  const narrow=W<520, H=c.h||240, m={l:50,r:narrow?62:118,t:12,b:26}, iw=W-m.l-m.r, ih=H-m.t-m.b, n=c.labels.length;
  const every=Math.max(1,Math.ceil(52/(iw/(n-1))));
  const mx=Math.max(...c.series.flatMap(s=>s.values)), step=niceStep(mx/4), max=Math.ceil(mx/step)*step;
  const x=i=>m.l+i*iw/(n-1), y=v=>m.t+ih-(v/max)*ih;
  let g=yAxis(W,m,ih,max,step,c.yfmt||axisFmt);
  c.labels.forEach((l,i)=>{ if((n-1-i)%every===0) g+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle" font-size="11" fill="#8a8984">${l}</text>`; });
  c.series.forEach((s,si)=>{
    if(si===0) g+=`<path d="M${x(0)} ${y(0)} ${s.values.map((v,i)=>`L${x(i)} ${y(v)}`).join(' ')} L${x(n-1)} ${y(0)}Z" fill="${s.color}" opacity=".08"/>`;
    g+=`<path d="${s.values.map((v,i)=>`${i?'L':'M'}${x(i)} ${y(v)}`).join(' ')}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const lv=s.values[n-1]; g+=`<circle cx="${x(n-1)}" cy="${y(lv)}" r="4.5" fill="${s.color}" stroke="#fff" stroke-width="2"/><text x="${x(n-1)+10}" y="${y(lv)+4}" font-size="12" fill="#0b0b0b"><tspan font-weight="600">${(c.fmt||money)(lv)}</tspan>${narrow?'':`<tspan fill="#52514e"> ${s.name}</tspan>`}</text>`;
  });
  g+=`<line id="${id}-xh" x1="0" x2="0" y1="${m.t}" y2="${m.t+ih}" stroke="#9a9993" stroke-width="1" style="display:none"/>`;
  const bw=iw/(n-1);
  c.labels.forEach((l,i)=>{ g+=`<rect x="${x(i)-bw/2}" y="${m.t}" width="${bw}" height="${ih}" fill="transparent" onmousemove="tipLine(event,'${id}',${i},${x(i)})" onmouseleave="hideTip('${id}')"/>`; });
  return `<svg width="${W}" height="${H}" role="img" aria-label="${c.title||'chart'}">${g}</svg>`;
}
function tipLine(e,id,i,xx){ const c=CH[id]; const xh=document.getElementById(id+'-xh'); xh.setAttribute('x1',xx); xh.setAttribute('x2',xx); xh.style.display='';
  showTip(e, `<div class="tt">${c.labels[i]}</div>`+c.series.map(s=>`<div class="tr"><span><i class="sw" style="background:${s.color}"></i> ${s.name}</span><b>${(c.fmt||money)(s.values[i])}</b></div>`).join('')+(c.extra?c.extra(i):'')); }
function stackSVG(id,W,c){
  const H=c.h||240, m={l:40,r:12,t:12,b:26}, iw=W-m.l-m.r, ih=H-m.t-m.b, n=c.labels.length;
  const tot=c.labels.map((_,i)=>c.series.reduce((a,s)=>a+s.values[i],0));
  const mx=Math.max(...tot), step=niceStep(mx/4), max=Math.ceil(mx/step)*step;
  const band=iw/n, bw=Math.min(24, band*0.62), y=v=>m.t+ih-(v/max)*ih;
  let g=yAxis(W,m,ih,max,step,v=>v);
  c.labels.forEach((l,i)=>{
    const cx=m.l+band*i+band/2, x0=cx-bw/2; let base=0;
    const topIdx = c.series.map((s,k)=>s.values[i]>0?k:-1).filter(k=>k>=0).pop();
    c.series.forEach((s,k)=>{ const v=s.values[i]; if(!v) return; const yb=y(base)-(base>0?2:0), yt=y(base+v); base+=v;
      if(k===topIdx){ const r=Math.min(4,(yb-yt)/2); g+=`<path d="M${x0} ${yb} L${x0} ${yt+r} Q${x0} ${yt} ${x0+r} ${yt} L${x0+bw-r} ${yt} Q${x0+bw} ${yt} ${x0+bw} ${yt+r} L${x0+bw} ${yb}Z" fill="${s.color}"/>`; }
      else g+=`<rect x="${x0}" y="${yt}" width="${bw}" height="${Math.max(0,yb-yt)}" fill="${s.color}"/>`; });
    if(i===n-1) g+=`<text x="${cx}" y="${y(tot[i])-6}" text-anchor="middle" font-size="11" font-weight="600" fill="#0b0b0b">${tot[i]}</text>`;
    if((n-1-i)%Math.max(1,Math.ceil(46/band))===0) g+=`<text x="${cx}" y="${H-6}" text-anchor="middle" font-size="11" fill="#8a8984">${l}</text>`;
    g+=`<rect x="${m.l+band*i}" y="${m.t}" width="${band}" height="${ih}" fill="transparent" onmousemove="tipStack(event,'${id}',${i})" onmouseleave="hideTip()"/>`;
  });
  return `<svg width="${W}" height="${H}" role="img" aria-label="${c.title||'chart'}">${g}</svg>`;
}
function tipStack(e,id,i){ const c=CH[id]; const t=c.series.reduce((a,s)=>a+s.values[i],0); showTip(e, `<div class="tt">${c.labels[i]}</div>`+c.series.map(s=>`<div class="tr"><span><i class="sw" style="background:${s.color}"></i> ${s.name}</span><b>${s.values[i]}</b></div>`).join('')+`<div class="tr" style="border-top:1px solid #eee;margin-top:4px;padding-top:4px"><span>Total</span><b>${t}</b></div>`); }
function hbarSVG(id,W,c){
  const stackLbl=(c.lw||170)>W*0.4, rowH=stackLbl?44:34, lw=stackLbl?0:(c.lw||170), m={l:stackLbl?0:lw,r:stackLbl?80:90,t:4,b:4}, H=c.items.length*rowH+m.t+m.b, iw=W-m.l-m.r;
  const max=Math.max(...c.items.map(d=>d.value))||1; let g='';
  c.items.forEach((d,i)=>{ const yc=m.t+i*rowH+(stackLbl?30:rowH/2), w=Math.max(2,d.value/max*iw), x0=m.l, th=stackLbl?12:16, r=4;
    g+= stackLbl ? `<text x="0" y="${yc-12}" font-size="12" fill="#52514e">${d.label}</text>` : `<text x="${m.l-10}" y="${yc+4}" text-anchor="end" font-size="12" fill="#52514e">${d.label}</text>`;
    g+=`<path d="M${x0} ${yc-th/2} L${x0+w-r} ${yc-th/2} Q${x0+w} ${yc-th/2} ${x0+w} ${yc-th/2+r} L${x0+w} ${yc+th/2-r} Q${x0+w} ${yc+th/2} ${x0+w-r} ${yc+th/2} L${x0} ${yc+th/2}Z" fill="${c.color||'var(--s1)'}"/>`;
    g+=`<text x="${x0+w+8}" y="${yc+4}" font-size="12" font-weight="600" fill="#0b0b0b">${(c.fmt||num)(d.value)}</text>`;
    g+=`<rect x="0" y="${m.t+i*rowH}" width="${W}" height="${rowH}" fill="transparent" onmousemove="showTip(event,'<div class=tt>${d.label}</div>${(c.fmt||num)(d.value)}${c.total?' · '+pct(d.value/c.total)+' of total':''}')" onmouseleave="hideTip()"/>`; });
  document.getElementById(id).style.height=H+'px';
  return `<svg width="${W}" height="${H}" role="img" aria-label="${c.title||'chart'}">${g}</svg>`;
}
function showTip(e,html){ const t=document.getElementById('tip'); t.innerHTML=html; t.style.display='block'; const w=t.offsetWidth; let x=e.clientX+14; if(x+w>innerWidth-8) x=e.clientX-w-14; t.style.left=x+'px'; t.style.top=(e.clientY+14)+'px'; }
function hideTip(id){ document.getElementById('tip').style.display='none'; if(id){const xh=document.getElementById(id+'-xh'); if(xh) xh.style.display='none';} }

function timeline(s, full=true){
  const done = s.events.map(e=>`<div class="ev ${e.st==='Delivered'?'done':''}"><div class="t">${e.st}</div><div class="m">${fdt(e.t)} · ${e.by}${e.note?' · '+e.note:''}</div>${e.media.length?`<div class="medias">${e.media.map(mediaThumb).join('')}</div>`:''}${e.train?`<div class="small sec" style="margin-top:4px">Train ${e.train}</div>`:''}</div>`).join('');
  const todo = ['Cancelled','Rejected'].includes(s.status) ? '' : s.flow.slice(s.stage+1).map(st=>`<div class="ev todo"><div class="t">${st}</div></div>`).join('');
  return `<div class="tl">${done}${full?todo:todo}</div>`;
}
function legCard(s,l){

    <div class="small" style="margin-top:4px">Railway ${money(l.rail)} + agent fee ${money(l.agentFee)}</div></div>`; }
  return `<div class="leg ${curLeg?'cur':''}"><div class="ln">Leg ${l.n} · Road (${l.city})</div><b>${l.mode==='Porter'?'Porter · '+l.porter.vehicle:'Own boy · '+l.boy.name}</b>
   <div class="small sec">${l.mode==='Porter'?`${l.porter.crn} · Driver ${l.porter.driver}`:l.boy.phone}</div><div class="small sec">${l.km} km · ${l.from.length>38?l.from.slice(0,38)+'…':l.from}</div>

function adminSetStatus(id){
  const s=SH.find(x=>x.id===id); const v=document.getElementById('mst').value; const i=s.flow.indexOf(v);

  else { s.status=v; s.events.push({st:v,t:new Date(),by:'Admin · Anil Kumar (manual)',media:[]}); }
  toast(`${id}: status set to "${v}"; WhatsApp sent`); render(); showShipment(id);
}
function adminUpload(id, inp){

}

function approveRequest(id){
  const s=SH.find(x=>x.id===id), m=(S.rqm&&S.rqm[id])||(s.from.city===s.to.city?'incity':'railway');

  const a1=pickV(document.getElementById('ra1').value), a3=pickV((document.getElementById('ra3')||{}).value);
  s.type = m==='railway'?'railway':'incity';
  makeLegs(s,{mode1:a1.mode,boy1:a1.boy,mode3:a3.mode,boy3:a3.boy});
  s.price = +document.getElementById('rprice').value || s.price;
  advance(s,'Approved & Assigned',null,null,{note:(m==='railway'?'Railway':m==='road'?'Direct road':'In-city')+' · final price '+money(s.price)+' · taken from wallet'});
  s.shop.wallet=Math.max(0,s.shop.wallet-s.price);
  const L=s.legs[0];
  closeModal(); render();
  toast(`${s.id} approved as ${m==='railway'?'Railway':m==='road'?'Direct road':'In-city'} · ${L.mode==='Porter'?'Porter order '+L.porter.crn+' booked':L.boy.name+' assigned'} · shopkeeper informed`);
}
function rejectRequest(id){

function cancelRequest(id){

}

function priceEstimate(type, w, km, m1, m3){
  if(type==='incity'){ const c = m1==='Porter'? r10(70+km*13+(w>10?60:0)) : r10(35+km*5); const p = m1==='Porter'? r10(c*1.24) : r10(60+km*9+w*4); return {lines:[[m1==='Porter'?'Porter fare (est.)':'Delivery charge', p]], total:p}; }
  const l1 = m1==='Porter'?190:110, l3 = m3==='Porter'?200:120, rail=r10(60+w*14), ag=110;
  const sub=l1+rail+ag+l3, total=r10(sub*1.22);

}

}

function reportData(id){
  const R2=mulberry32(id.length*977+id.charCodeAt(0));
  const ri=(a,b)=>a+Math.floor(R2()*(b-a+1));
  switch(id){
    case 'daily': { const rows=DAYS.map((d,i)=>{const t=D_IN[i]+D_RL[i]; const del=t-ri(2,8); const rv=t*ri(390,470); return [d,D_IN[i],D_RL[i],t,del,ri(0,3),money(rv)];}).reverse();
      return {kp:[['Bookings (14 days)',num(D_IN.reduce((a,b)=>a+b)+D_RL.reduce((a,b)=>a+b))],['Railway share',pct(D_RL.reduce((a,b)=>a+b)/(D_IN.reduce((a,b)=>a+b)+D_RL.reduce((a,b)=>a+b)))],['Cancellation rate','1.8%']],cols:['Date',{t:'In-city',num:1},{t:'Railway',num:1},{t:'Total',num:1},{t:'Delivered',num:1},{t:'Cancelled',num:1},{t:'Revenue',num:1}],rows}; }
    case 'revenue': { const rows=MONTHS.map((m,i)=>{const r=REV[i],p=PROFIT[i],c=r-p; return [m,num(PARCELS_M[i]),money(r),money(c*0.46),money(c*0.31),money(c*0.093),money(c*0.107),money(c*0.03),`<b>${money(p)}</b>`,pct(p/r)];}).reverse();
      return {kp:[['Revenue (12 months)',lakh(REV.reduce((a,b)=>a+b))],['Net profit (12 months)',lakh(PROFIT.reduce((a,b)=>a+b))],['Average margin',pct(PROFIT.reduce((a,b)=>a+b)/REV.reduce((a,b)=>a+b))]],cols:['Month',{t:'Parcels',num:1},{t:'Revenue',num:1},{t:'Porter',num:1},{t:'Railway',num:1},{t:'Agents',num:1},{t:'Boys',num:1},{t:'Other',num:1},{t:'Net profit',num:1},{t:'Margin',num:1}],rows}; }
    case 'shop': return {kp:[['Active shopkeepers',SHOPS.filter(s=>s.status==='Active').length],['Top shopkeeper','Sharma Textiles'],['Avg spend / shop',money(54200)]],cols:['Shopkeeper','City',{t:'Parcels',num:1},{t:'In-city',num:1},{t:'Railway',num:1},{t:'Spend',num:1},{t:'Avg / parcel',num:1},{t:'Wallet',num:1},'Last booking'],
      rows:SHOPS.map(s=>{const a=ri(20,90),b=ri(5,60); const sp=a*ri(140,220)+b*ri(600,900); return [s.name,s.city,a+b,a,b,money(sp),money(sp/(a+b)),money(s.wallet),fdt(minsAgo(ri(30,4000)))];}).sort((x,y)=>y[2]-x[2])};
    case 'boy': return {kp:[['Jobs done (month)',num(1980)],['Avg on-time',  '94.6%'],['Avg rating','★ 4.6']],cols:['Delivery boy','City',{t:'Jobs',num:1},{t:'On-time',num:1},{t:'Avg pickup time',num:1},{t:'Avg delivery time',num:1},{t:'Rating',num:1},{t:'Km',num:1},{t:'Earnings',num:1},{t:'Complaints',num:1}],
      rows:BOYS.map(b=>{const j=ri(140,320); return [b.name,b.city,j,(89+R2()*10).toFixed(1)+'%',ri(9,22)+' min',ri(24,48)+' min','★ '+b.rating,num(j*ri(6,11)),money(j*ri(42,55)),ri(0,3)];})};
    case 'agent': return {kp:[['Parcels handled',num(1420)],['Avg time to load',  '2.6 h'],['Damage reports','3']],cols:['Agency','Station',{t:'Received from shops',num:1},{t:'Loaded on train',num:1},{t:'Arrivals handled',num:1},{t:'Avg load time',num:1},{t:'Damage',num:1},{t:'Commission',num:1}],
      rows:AGENTS.map(a=>{const r=ri(60,240); return [a.agency,a.station,r,r-ri(0,4),ri(40,200),(1.5+R2()*2.5).toFixed(1)+' h',ri(0,2),money((r+ri(40,200))*a.fee)];})};
    case 'route': { const pairs=[['Jaipur','Delhi'],['Jaipur','Mumbai'],['Delhi','Jaipur'],['Jaipur','Lucknow'],['Ahmedabad','Mumbai'],['Delhi','Mumbai'],['Kota','Delhi'],['Mumbai','Jaipur'],['Lucknow','Delhi']];
      return {kp:[['Routes active',pairs.length],['Fastest route','Kota → Delhi (5.8 h)'],['Most profitable','Jaipur → Mumbai']],cols:['Route',{t:'Parcels',num:1},{t:'Avg weight',num:1},{t:'Avg train time',num:1},{t:'Avg door-to-door',num:1},{t:'Revenue',num:1},{t:'Cost',num:1},{t:'Profit',num:1}],
      rows:pairs.map(p=>{const n=ri(40,260), rv=n*ri(650,1100), c=rv*(0.74+R2()*0.08); return [p.join(' → '),n,ri(6,18)+' kg',ri(5,20)+' h',ri(18,40)+' h',money(rv),money(c),money(rv-c)];})}; }
    case 'porter': return {kp:[['Porter orders',num(1312)],['Porter spend',lakh(309400)],['Cancelled by Porter','1.9%']],cols:['City',{t:'Orders',num:1},{t:'2W / 3W / Ace',num:0},{t:'Avg fare',num:1},{t:'Total spend',num:1},{t:'Avg pickup wait',num:1},{t:'Cancelled',num:1}],
      rows:CITY_NAMES.map(c=>{const n=ri(80,400); return [c,n,`${ri(50,70)}% / ${ri(20,35)}% / ${ri(3,10)}%`,money(ri(170,260)),money(n*ri(170,260)),ri(8,19)+' min',ri(0,9)];})};
    case 'delay': { const L=SH.filter(s=>s.type==='railway').slice(0,10);
      return {kp:[['Delayed this month','38 (2.1%)'],['Damaged','4'],['Failed delivery attempts','17']],cols:['Tracking ID','Route','Stage','Delay','Reason','Responsible','Action taken'],
      rows:L.map((s,i)=>[`<span class="id">${s.id}</span>`,`${s.from.city} → ${s.to.city}`,['On train','At destination agent','Out for delivery','Pickup'][i%4],ri(1,9)+' h',['Train late','Receiver not available','Porter driver cancelled','Wrong address','Parcel missed train'][i%5],['Railways','Receiver','Porter','Shopkeeper','Origin agent'][i%5],['Customer informed','Re-attempt booked','Re-booked Porter','Address updated','Loaded on next train'][i%5]])}; }
    case 'notify': { const ev=['Booking confirmed','Picked up','Loaded on train','Arrived at destination','Out for delivery + OTP','Delivered','Login OTP'];
      return {kp:[['WhatsApp sent',num(18420)],['SMS sent',num(9310)],['Messaging cost',money(5210)]],cols:['Event',{t:'WhatsApp sent',num:1},{t:'WhatsApp delivered',num:1},{t:'SMS sent',num:1},{t:'SMS delivered',num:1},{t:'Cost',num:1}],
      rows:ev.map(e=>{const w=e==='Login OTP'?0:ri(1500,3600), s=ri(500,2400); return [e,num(w),w?(96+R2()*3).toFixed(1)+'%':'—',num(s),(95+R2()*4).toFixed(1)+'%',money(w*0.16+s*0.2)];})}; }
    case 'gst': return {kp:[['Taxable value (12 m)',lakh(REV.reduce((a,b)=>a+b)/1.18)],['GST collected',lakh(REV.reduce((a,b)=>a+b)*0.18/1.18)],['Filing status','Up to date']],cols:['Month',{t:'Invoices',num:1},{t:'Taxable value',num:1},{t:'CGST 9%',num:1},{t:'SGST 9%',num:1},{t:'IGST 18%',num:1},{t:'Total GST',num:1}],
      rows:MONTHS.map((m,i)=>{const tv=REV[i]/1.18, intra=0.62; return [m,num(PARCELS_M[i]),money(tv),money(tv*intra*0.09),money(tv*intra*0.09),money(tv*(1-intra)*0.18),money(tv*0.18)];}).reverse()};
  }
}

/* =========================================================================
   PHONE SHELLS: DELIVERY BOY + RAILWAY AGENT

function phoneShell(){
  const isBoy=S.role==='boy'; const role=ROLES[S.role];
  const notes = isBoy ? [['What the delivery boy can do',['Go online or offline with one tap','See assigned pickups and drops (in-city and railway legs)','Open the address in Google Maps, call the shop or receiver','Take pickup and drop photos/videos with the phone camera (time and GPS saved)','Enter the receiver OTP to complete delivery','See today\'s and weekly earnings and payouts']],['Try this',[`Open job <b>${D1.id}</b>, upload a pickup photo (or use a sample), then deliver with OTP <b>${D1.otp}</b>`,'Switch to Admin and open the same parcel: the photos and status show up there']]]
    : [['What the railway agent can do',['See parcels coming to the station from shops','Confirm receipt with photo/video and parcel condition','Enter train number, PWB/RR number, coach, timings and charges','Upload loading video and receipt photo','At the destination: mark the parcel arrived and unloaded','The final delivery order (Porter or own boy) is created automatically']],['Try this',[`In <b>Incoming</b>, receive parcel <b>${D4.id}</b>, then load it on a train`,`In <b>Arrivals</b>, mark <b>${D3.id}</b> as arrived: the system books Leg 3 delivery`]]];
  return `<div class="main phone-wrap" style="min-height:100%"><div class="demo-bar">Demo mockup with sample data · ${role.label} screens are made for the phone browser and can be installed to the home screen</div>
   <header class="top"><div class="logo"><div class="mk">PS</div>${BRAND}</div><div><div class="crumb">${role.label} login (mobile)</div><h1>${role.user}</h1></div><div class="sp"></div><button class="btn" onclick="logout()">⇄ Switch login</button></header>
   <div class="content"><div class="phone-stage"><div class="phone"><div class="notch"></div>${isBoy?boyApp():agentApp()}</div>
   <div class="notes">${notes.map(n=>`<h3>${n[0]}</h3><ul>${n[1].map(x=>`<li>${x}</li>`).join('')}</ul>`).join('')}
   <div class="pricebox small">Photos and videos are compressed on the phone before upload. Each file stores the time, GPS location, uploader and parcel status.</div></div></div></div></div>`;
}
/* --- delivery boy --- */
function boyJobs(){
  const out=[];
  SH.forEach(s=>{ if(s.stage===0||['Cancelled','Rejected'].includes(s.status)) return;
    if(s.type==='incity' && s.legs[0].boy===RAMESH && s.status!=='Delivered') out.push({s,leg:s.legs[0],kind:'incity'});
    if(s.type==='railway' && s.legs[0].boy===RAMESH && s.legs[0].mode==='Own' && s.stage<=2) out.push({s,leg:s.legs[0],kind:'leg1'});
    if(s.type==='railway' && s.legs[2].boy===RAMESH && s.legs[2].mode==='Own' && s.stage>=9 && s.status!=='Delivered') out.push({s,leg:s.legs[2],kind:'leg3'});
  }); return out;
}
function boyApp(){
  const t=S.boyTab; let body='';
  const jobs=boyJobs();
  if(S.boyJob){ body=boyJobScreen(SH.find(s=>s.id===S.boyJob)); }
  else if(t==='home'){ body=`<div class="pcard"><div class="row"><div class="sp"><div class="h">${RAMESH.online?'You are online':'You are offline'}</div><div class="small muted">${RAMESH.online?'New jobs will be assigned to you':'Turn on to get jobs'}</div></div><button class="toggle ${RAMESH.online?'on':''}" onclick="RAMESH.online=!RAMESH.online;render()"></button></div></div>
     <div class="grid g3 keep3" style="gap:8px;margin-bottom:10px">${[['Today',`${money(420)}`],['Jobs',jobs.length+' open'],['Done','7']].map(k=>`<div class="pcard" style="margin:0;text-align:center"><div class="small muted">${k[0]}</div><b>${k[1]}</b></div>`).join('')}</div>
     <div class="small muted" style="margin:4px 2px 8px">ASSIGNED JOBS</div>${jobs.map(boyJobCard).join('')||'<div class="pcard muted">No jobs right now</div>'}`; }
  else if(t==='jobs'){ const done=SH.filter(s=>s.legs.some(l=>l.boy===RAMESH)&&s.status==='Delivered').slice(0,8); body=`<div class="small muted" style="margin:4px 2px 8px">OPEN</div>${jobs.map(boyJobCard).join('')}<div class="small muted" style="margin:12px 2px 8px">COMPLETED</div>${done.map(s=>`<div class="pcard"><div class="row"><b class="id">${s.id}</b><div class="sp"></div>${chip('Delivered')}</div><div class="small muted">${s.to.addr}</div></div>`).join('')}`; }
  else if(t==='earn'){ const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'], vals=[380,460,410,520,390,610,420];
     body=`<div class="pcard"><div class="small muted">This week</div><div style="font-size:30px;font-weight:700">${money(vals.reduce((a,b)=>a+b))}</div><div class="small muted">54 jobs · ★ ${RAMESH.rating} · payout every Monday</div>${chartDiv('bEarn',{kind:'hbar',items:days.map((d,i)=>({label:d,value:vals[i]})),fmt:money,lw:40,title:'Earnings this week'})}</div>
     <div class="pcard"><div class="h">Payouts</div>${[['Last Monday',2840,'Paid'],['2 weeks ago',3120,'Paid'],['3 weeks ago',2675,'Paid']].map(p=>`<div class="row small" style="padding:6px 0;border-bottom:1px dashed var(--line)"><span class="sp">${p[0]}</span><b>${money(p[1])}</b>${chip(p[2],'ok')}</div>`).join('')}</div>`; }
  else { body=`<div class="pcard"><div class="h">${RAMESH.name}</div><div class="small muted">${RAMESH.id} · ${RAMESH.phone}</div><div class="small muted">${RAMESH.vehicle}</div></div><div class="pcard">${['Driving licence','Aadhaar','Bank account (HDFC)','Vehicle RC'].map(d=>`<div class="row small" style="padding:6px 0"><span class="sp">${d}</span>${chip('Verified','ok')}</div>`).join('')}</div><button class="btn block" onclick="logout()">Logout</button>`; }
  return `<div class="ph-head"><div class="sp"><div class="t">${S.boyJob?'Job '+S.boyJob:'Hi, '+RAMESH.name.split(' ')[0]}</div><div class="s">${S.boyJob?'<a style="color:#fff" href="#" onclick="goBack();return false">← Back to jobs</a>':'Delivery Boy · Jaipur'}</div></div><button class="btn sm sw" style="display:none;background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.3);color:#fff" onclick="logout()">⇄ Switch</button></div>
   <div class="ph-body">${body}</div>
   <div class="ph-nav">${[['home','⌂','Home'],['jobs','☰','Jobs'],['earn','₹','Earnings'],['me','◉','Profile']].map(n=>`<button class="${S.boyTab===n[0]&&!S.boyJob?'on':''}" onclick="boyTabGo('${n[0]}')"><b>${n[1]}</b>${n[2]}</button>`).join('')}</div>`;
}
function boyJobCard(j){
  const s=j.s; const lbl = j.kind==='incity'?'In-city delivery':j.kind==='leg1'?'Railway · drop at station':'Railway · deliver from station';
  const from = j.kind==='leg3'? s.legs[1].agentD.station : s.shop.name; const to = j.kind==='leg1'? s.legs[1].agentO.station : s.to.addr;
  return `<div class="pcard" onclick="boyOpen('${s.id}')" style="cursor:pointer"><div class="row"><b class="id">${s.id}</b><span class="sp"></span>${j.kind==='incity'?'<span class="tag city">In-city</span>':'<span class="tag rail">Railway</span>'}</div>
   <div class="small" style="margin-top:6px"><b>${lbl}</b> <span class="muted">· ${s.pickup}</span></div><div class="small sec">↑ ${from}</div><div class="small sec">↓ ${to}</div><div class="row small" style="margin-top:6px"><span class="muted">${s.weight} kg · ${j.leg.km} km</span><span class="sp"></span>${chip(s.status)}</div></div>`;
}
function capture(key, label){
  const m=S.pending[key];
  return m ? `<div class="medias">${mediaThumb(m)}</div><a href="#" class="small" onclick="delete S.pending['${key}'];render();return false">Retake</a>`
   : `<label class="upl"><input type="file" accept="image/*,video/*" capture="environment" onchange="gotMedia('${key}','${label}',this)">📷 Take ${label.toLowerCase()} (photo or video)</label><a href="#" class="small" onclick="S.pending['${key}']={label:'${label}',kind:'img',t:new Date(),gps:'26.9124, 75.7873'};render();return false">Use sample photo (demo)</a>`;
}
function gotMedia(key,label,inp){ const f=inp.files[0]; if(!f) return; S.pending[key]={label, kind:f.type.startsWith('video')?'video':'img', url:URL.createObjectURL(f), t:new Date(), gps:'26.9124, 75.7873'}; render(); }
function advance(s, st, by, media, extra){ const i=s.flow.indexOf(st); for(let k=s.stage+1;k<i;k++) pushEvent(s,s.flow[k],new Date()); pushEvent(s,st,new Date(),extra); const e=s.events.at(-1); if(by) e.by=by; if(media) e.media=media.filter(Boolean); s.stage=i; s.status=st; }
function boyJobScreen(s){
  const kind = s.type==='incity'?'incity': s.stage<=3?'leg1':'leg3';
  const L = kind==='leg3'?s.legs[2]:s.legs[0];
  const pickedSt = kind==='incity'?'Picked Up':kind==='leg1'?'Picked Up from Shop':'Out for Delivery';
  const pickedDone = kind==='incity'? s.stage>=2 : kind==='leg1'? s.stage>=2 : s.stage>=10;
  const fl = kind==='leg3'? s.legs[1].agentD.loc : s.from, tl = kind==='leg1'? s.legs[1].agentO.loc : s.to;
  const from = kind==='leg3'? `${s.legs[1].agentD.agency}, ${s.legs[1].agentD.station}` : `${s.shop.name}, ${s.from.addr} (Landmark: ${s.from.landmark})`;
  const to = kind==='leg1'? `${s.legs[1].agentO.agency}, ${s.legs[1].agentO.station}` : `${s.to.name}, ${s.to.addr} (Landmark: ${s.to.landmark})`;
  const finished = kind==='leg1' ? s.stage>=3 : s.status==='Delivered';
  return `<div class="pcard"><div class="row"><b>${kind==='incity'?'In-city delivery':kind==='leg1'?'Railway Leg 1: shop → station':'Railway Leg 3: station → receiver'}</b></div>
    <div class="small muted">${s.items} · ${s.km||L.km} km</div><div class="small" style="margin-top:4px">${s.qty} box · ${s.dims} · ${s.weight} kg${s.fragile?' · <b style="color:var(--warn-x)">Fragile</b>':''}</div><div class="small muted">Pickup: ${s.pickup}</div></div>
   <div class="pcard">
    <div class="step ${pickedDone?'done':'cur'}"><div class="n">1</div><div class="sp"><b>Pickup</b><div class="small sec">${from}</div>
      <div class="row" style="margin:6px 0"><a class="btn sm" target="_blank" href="https://maps.google.com/?q=${fl.lat},${fl.lng}">Navigate</a><button class="btn sm" onclick="toast('Calling… (demo)')">Call</button></div>
      ${pickedDone?'<span class="small" style="color:var(--good-x)">✓ Picked up</span>':`${capture('pick','Pickup photo')}<button class="btn pri block" style="margin-top:8px" onclick="boyPick('${s.id}','${pickedSt}')">Confirm pickup</button>`}</div></div>
    <div class="step ${finished?'done':pickedDone?'cur':''}"><div class="n">2</div><div class="sp"><b>${kind==='leg1'?'Hand over to railway agent':'Deliver to receiver'}</b><div class="small sec">${to}</div>
      ${finished?'<span class="small" style="color:var(--good-x)">✓ Completed</span>':pickedDone?`<div class="row" style="margin:6px 0"><a class="btn sm" target="_blank" href="https://maps.google.com/?q=${tl.lat},${tl.lng}">Navigate</a><button class="btn sm" onclick="toast('Calling… (demo)')">Call</button></div>
        ${kind!=='leg1'?`<label class="f">Receiver OTP <span class="muted">(demo OTP: ${s.otp})</span></label><input class="inp" id="otp" inputmode="numeric" maxlength="4" placeholder="4-digit OTP" style="margin-bottom:8px">`:''}
        ${capture('drop',kind==='leg1'?'Handover photo':'Delivery photo')}<button class="btn ok block" style="margin-top:8px" onclick="boyDrop('${s.id}','${kind}')">${kind==='leg1'?'Handed to agent':'Mark delivered'}</button>`:'<span class="small muted">After pickup</span>'}</div></div>
   </div>`;
}
function boyPick(id, st){ const s=SH.find(x=>x.id===id); if(!S.pending.pick) return toast('Please take a pickup photo first'); advance(s, st, RAMESH.name+' (Delivery Boy)', [S.pending.pick]); delete S.pending.pick; toast('Pickup confirmed · shopkeeper & receiver notified on WhatsApp'); render(); }
function boyDrop(id, kind){ const s=SH.find(x=>x.id===id);
  if(kind!=='leg1'){ const o=document.getElementById('otp').value; if(o!==s.otp) return toast('Wrong OTP. Ask the receiver for the OTP sent by SMS'); }
  if(!S.pending.drop) return toast('Please take a photo first');
  if(kind==='leg1'){ advance(s,'Handed to Origin Agent',RAMESH.name+' (Delivery Boy)',[S.pending.drop]); toast('Handed over to '+s.legs[1].agentO.agency+' · agent notified'); }
  else { advance(s,'Delivered',RAMESH.name+' (Delivery Boy)',[S.pending.drop,{label:'OTP verified',kind:'img',t:new Date(),gps:'26.8851, 75.8130'}]); toast('Delivered ✓ · photo sent to shopkeeper on WhatsApp'); }
  S.pending={}; render(); }

/* --- railway agent --- */
function agentApp(){
  const t=S.agentTab; let body='';
  const incoming=SH.filter(s=>s.type==='railway'&&s.legs[1].agentO===MAHESH&&s.stage>=1&&s.stage<=4&&s.status!=='Cancelled');
  const arrivals=SH.filter(s=>s.type==='railway'&&s.legs[1].agentD===MAHESH&&s.stage>=5&&s.stage<=8);
  if(S.agentSel){ body=agentScreen(SH.find(s=>s.id===S.agentSel)); }
  else if(t==='home'){ body=`<div class="grid g2 keep2" style="gap:8px;margin-bottom:10px">${[['Coming from shops',incoming.filter(s=>s.stage<3).length],['To receive / load',incoming.filter(s=>s.stage>=3).length],['Arriving by train',arrivals.length],['This month',`${rint(140,190)} parcels`]].map(k=>`<div class="pcard" style="margin:0"><div class="small muted">${k[0]}</div><b style="font-size:18px">${k[1]}</b></div>`).join('')}</div>
     <div class="small muted" style="margin:4px 2px 8px">NEEDS ACTION</div>${[...incoming.filter(s=>s.stage>=3),...arrivals].map(agentCard).join('')||'<div class="pcard muted">Nothing pending</div>'}
     <div class="pcard"><div class="small muted">Commission this month</div><b style="font-size:20px">${money(8650)}</b><div class="small muted">173 parcels × ₹50 · railway charges reimbursed weekly</div></div>`; }
  else if(t==='in'){ body=`<div class="small muted" style="margin:4px 2px 8px">PARCELS FOR ${MAHESH.station.toUpperCase()}</div>`+(incoming.map(agentCard).join('')||'<div class="pcard muted">No incoming parcels</div>'); }
  else if(t==='arr'){ body=`<div class="small muted" style="margin:4px 2px 8px">ARRIVING AT ${MAHESH.station.toUpperCase()}</div>`+(arrivals.map(agentCard).join('')||'<div class="pcard muted">No arrivals</div>'); }
  else { const rec=SH.filter(s=>s.type==='railway'&&(s.legs[1].agentO===MAHESH||s.legs[1].agentD===MAHESH)&&s.stage>8).slice(0,10);
     body=`<div class="pcard"><div class="h">${MAHESH.agency}</div><div class="small muted">${MAHESH.name} · ${MAHESH.station}</div><div class="small muted">Fee ${money(MAHESH.fee)} per parcel</div></div><div class="small muted" style="margin:4px 2px 8px">HISTORY</div>${rec.map(s=>`<div class="pcard"><div class="row"><b class="id">${s.id}</b><span class="sp"></span>${chip(s.status)}</div><div class="small sec">${s.from.city} → ${s.to.city} · Train ${s.legs[1].train.no}</div><div class="small muted">${s.legs[1].train.pwb} · ${money(s.legs[1].rail)}</div></div>`).join('')}<button class="btn block" onclick="logout()">Logout</button>`; }
  return `<div class="ph-head"><div class="sp"><div class="t">${S.agentSel?'Parcel '+S.agentSel:MAHESH.agency}</div><div class="s">${S.agentSel?'<a style="color:#fff" href="#" onclick="goBack();return false">← Back</a>':'Railway Agent · '+MAHESH.station}</div></div><button class="btn sm sw" style="display:none;background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.3);color:#fff" onclick="logout()">⇄ Switch</button></div>
   <div class="ph-body">${body}</div>
   <div class="ph-nav">${[['home','⌂','Home'],['in','⇣','Incoming'],['arr','🚆','Arrivals'],['rec','☰','Records']].map(n=>`<button class="${S.agentTab===n[0]&&!S.agentSel?'on':''}" onclick="agentTabGo('${n[0]}')"><b>${n[1]}</b>${n[2]}</button>`).join('')}</div>`;
}
function agentCard(s){
  const isArr = s.legs[1].agentD===MAHESH;
  const next = isArr ? 'Confirm arrival' : s.stage<3 ? 'On the way from shop' : s.stage===3 ? 'Receive parcel' : 'Load on train';
  return `<div class="pcard" style="cursor:pointer" onclick="agentOpen('${s.id}')"><div class="row"><b class="id">${s.id}</b><span class="sp"></span>${chip(s.status)}</div>
   <div class="small sec" style="margin-top:4px">${s.from.city} → ${s.to.city} · ${s.weight} kg · ${s.items}</div>
   ${isArr?`<div class="small muted">Train ${s.legs[1].train.no} · ${s.legs[1].train.pwb}${s.delayed?' · running late':''}</div>`:`<div class="small muted">From ${s.shop.name}</div>`}
   <div class="row" style="margin-top:6px"><span class="small" style="color:var(--primary-d);font-weight:600">${next} →</span></div></div>`;
}
function agentScreen(s){
  const isArr = s.legs[1].agentD===MAHESH; const tr=s.legs[1].train;
  let act='';
  if(!isArr && s.stage<3) act=`<div class="pcard small muted">Parcel is on the way from the shop (${s.legs[0].mode==='Porter'?'Porter '+s.legs[0].porter.crn:s.legs[0].boy.name}). You will get a WhatsApp message when it reaches you.</div>`;
  else if(!isArr && s.stage===3) act=`<div class="pcard"><div class="h">Receive parcel</div><div class="small muted" style="margin-bottom:8px">Check the parcel, weigh it and take a photo</div>
     <label class="f">Condition</label><div class="seg" style="margin-bottom:10px"><button class="on">OK</button><button onclick="toast('If damaged, admin and shopkeeper are alerted with the photo')">Damaged</button></div>
     <label class="f">Actual weight (kg)</label><input class="inp" value="${s.weight}" style="margin-bottom:10px">${capture('rcv','Parcel received')}
     <button class="btn pri block" style="margin-top:10px" onclick="agentReceive('${s.id}')">Confirm received</button></div>`;
  else if(!isArr && s.stage===4) act=`<div class="pcard"><div class="h">Load on train</div><div class="small muted" style="margin-bottom:8px">Enter the railway booking details</div>
     <div class="grid g2" style="gap:8px"><div><label class="f">Train no.</label><input class="inp" id="tno" value="${tr.no}"></div><div><label class="f">Journey date</label><input class="inp" type="date" value="${NOW.toISOString().slice(0,10)}"></div></div>
     <label class="f" style="margin-top:8px">Train name</label><input class="inp" value="${tr.name}">
     <div class="grid g2" style="gap:8px;margin-top:8px"><div><label class="f">PWB / RR no.</label><input class="inp" id="pwb" value="${tr.pwb}"></div><div><label class="f">Coach / van</label><input class="inp" value="${tr.coach}"></div></div>
     <div class="grid g2" style="gap:8px;margin-top:8px"><div><label class="f">Departure</label><input class="inp" type="time" value="${addMin(NOW,40).toTimeString().slice(0,5)}"></div><div><label class="f">Expected arrival</label><input class="inp" value="+${tr.hours} h"></div></div>
     <label class="f" style="margin-top:8px">Railway charges paid (₹)</label><input class="inp" value="${tr.charges}" style="margin-bottom:10px">
     ${capture('load','Loading video')}<div style="height:8px"></div>${capture('rr','PWB receipt')}
     <button class="btn pri block" style="margin-top:10px" onclick="agentLoad('${s.id}')">Save & mark loaded</button></div>`;
  else if(isArr && s.stage<=8) act=`<div class="pcard"><div class="h">Confirm arrival & unloading</div><div class="small muted" style="margin-bottom:8px">Train ${tr.no} · ${tr.pwb} · ${tr.coach}</div>
     <label class="f">Condition</label><div class="seg" style="margin-bottom:10px"><button class="on">OK</button><button onclick="toast('Damage reported to admin with photos')">Damaged</button></div>
     ${capture('unl','Unloading photo')}
     <label class="f" style="margin-top:10px">Final delivery by</label><select class="inp" id="l3"><option>Auto (system decides)</option><option>Own delivery boy</option><option>Porter</option></select>
     <button class="btn pri block" style="margin-top:10px" onclick="agentArrive('${s.id}')">Confirm received & book delivery</button></div>`;
  else act=`<div class="pcard small" style="color:var(--good-x)">✓ Done. ${s.status}</div>`;
  return `<div class="pcard"><div class="row"><b class="id">${s.id}</b><span class="sp"></span>${chip(s.status)}</div><div class="small sec" style="margin-top:4px">${s.from.city} → ${s.to.city}</div>
    <div class="kv small" style="margin-top:8px;grid-template-columns:90px 1fr"><div>Sender</div><div>${s.shop.name}</div><div>Receiver</div><div>${s.to.name}, ${s.to.city}</div><div>Contents</div><div>${s.items}</div><div>Boxes</div><div>${s.qty} × ${s.dims}</div><div>Weight</div><div>${s.weight} kg${s.fragile?' · Fragile':''}</div></div></div>${act}`;
}
function agentReceive(id){ const s=SH.find(x=>x.id===id); if(!S.pending.rcv) return toast('Please take a photo first'); advance(s,'Received by Origin Agent',MAHESH.name+' (Railway Agent)',[S.pending.rcv]); S.pending={}; toast('Received ✓ · shopkeeper notified'); render(); }
function agentLoad(id){ const s=SH.find(x=>x.id===id); if(!S.pending.load) return toast('Please add the loading video or photo');
  const tr=s.legs[1].train; tr.no=document.getElementById('tno').value; tr.pwb=document.getElementById('pwb').value;
  advance(s,'Loaded on Train',MAHESH.name+' (Railway Agent)',[S.pending.load,S.pending.rr],{train:`${tr.no} · ${tr.name} · ${tr.pwb}`}); S.pending={};
  toast(`Loaded on train ${tr.no} · WhatsApp sent to shopkeeper, receiver and ${s.legs[1].agentD.agency}`); render(); }
function agentArrive(id){ const s=SH.find(x=>x.id===id); if(!S.pending.unl) return toast('Please take an unloading photo first');
  const ch=document.getElementById('l3').value; if(ch==='Porter'){ s.legs[2]=roadLeg(3,s.to.city,s.legs[1].agentD.loc,s.to,'Porter',null,s.weight); s.cost=s.legs.reduce((a,l)=>a+l.cost,0); }
  if(s.stage<7) advance(s,'Arrived at Destination',MAHESH.name+' (Railway Agent)');
  advance(s,'Received by Destination Agent',MAHESH.name+' (Railway Agent)',[S.pending.unl]); advance(s,'Leg 3 Assigned');
  S.pending={}; toast(s.legs[2].mode==='Porter'?`Porter order ${s.legs[2].porter.crn} created automatically for final delivery`:`Final delivery assigned to ${s.legs[2].boy.name}`); render(); }

/* deep links: #admin/requests, #shop/sbook, #boy, #agent/arr, #track/PS24101 */
window.onerror = (m,src,l,c) => { document.title='ERR '+m+' @'+l+':'+c; };
history.replaceState({n:0},'',location.href);
if(location.hash.length>1) applyHash(); else render();
</script>
